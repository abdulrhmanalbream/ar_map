org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The project lives under a path containing Arabic characters ("سراب").
# AGP blocks this by default because some native toolchain steps mishandle
# non-ASCII paths on Windows. We build with Java/Kotlin only (no NDK
# compilation), so the risk does not apply here -- verified by a real
# assembleDebug run. See README "If the build ever breaks on the path".
android.overridePathCheck=true

name: sarab-platform
services:
  acme:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: [maintenance]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./acme-work:/var/lib/letsencrypt
      - ./acme-logs:/var/log/letsencrypt
      - /var/www/certbot/.well-known/acme-challenge:/var/www/certbot/.well-known/acme-challenge
    mem_limit: 256m
    cpus: 0.30
    pids_limit: 64
  api:
    build: ./server
    restart: unless-stopped
    ports:
      - '127.0.0.1:9087:8080'
    env_file: .env
    environment:
      DATA_DIR: /data
      WEB_ROOT: /app/web
      PORT: 8080
      TRUST_PROXY: 'true'
    volumes:
      - ./data:/data
      - ./web/dist:/app/web:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  edge:
    image: nginx@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports:
      - '9443:8443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/sarab-tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}

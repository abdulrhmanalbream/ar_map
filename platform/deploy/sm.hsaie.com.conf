# Dedicated Sarab virtual host. Existing virtual hosts and their certificates stay separate.
server {
    listen 80;
    listen [::]:80;
    server_name sm.hsaie.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://sm.hsaie.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sm.hsaie.com;
    ssl_certificate /opt/sarab-platform/tls/domain/fullchain.pem;
    ssl_certificate_key /opt/sarab-platform/tls/domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;
    client_body_timeout 15;
    location / {
        proxy_pass http://127.0.0.1:9087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
}

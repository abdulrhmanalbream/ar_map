user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 64k;
    client_body_timeout 15;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SARAB:1m;
    server {
        listen 8443 ssl default_server;
        server_name 167.86.106.163;
        ssl_certificate /etc/sarab-tls/fullchain.pem;
        ssl_certificate_key /etc/sarab-tls/privkey.pem;
        location / {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
        }
    }
    server {
        listen 8443 ssl;
        server_name sm.hsaie.com;
        ssl_certificate /etc/sarab-tls/domain/fullchain.pem;
        ssl_certificate_key /etc/sarab-tls/domain/privkey.pem;
        location / {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
        }
    }
}
